name: Publish website
on:
  push:
    branches: [main]
    paths: ["static/**", "web/**", "scripts/build_pages.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Windows client"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://zhehong268.github.io/liuziqi/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/browser.test.cjs
      - name: Download Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/pages/downloads
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "MoYi-Setup-Windows-x64.exe" --dir dist/pages/downloads --clobber
      - run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deployment
