<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>六子棋 Agent Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">电子斗蛐蛐 · 第一版教学 Demo</p>
          <h1>六子棋 Agent</h1>
          <p>19×19 棋盘，黑方先手。这个版本先练习前后端、数据库和游戏规则。</p>
        </div>
        <div class="hero-actions">
          <button id="new-game" class="primary">新建棋局</button>
          <a id="export-game" class="button-link disabled" href="#" aria-disabled="true">导出棋谱</a>
        </div>
      </header>

      <section class="game-layout">
        <div class="board-card">
          <div class="game-meta">
            <span id="game-status">正在初始化...</span>
            <span id="turn-status"></span>
          </div>
          <div id="board" class="board" aria-label="19乘19六子棋棋盘"></div>
        </div>

        <aside class="side-card">
          <h2>本局信息</h2>
          <dl>
            <div><dt>棋局编号</dt><dd id="game-id">-</dd></div>
            <div><dt>当前玩家</dt><dd id="current-player">-</dd></div>
            <div><dt>本回合剩余</dt><dd id="remaining-stones">-</dd></div>
          </dl>
          <div class="legend">
            <span><i class="stone black"></i>黑方（你）</span>
            <span><i class="stone white"></i>白方（基线 AI）</span>
          </div>
          <p id="message" class="message">点击“新建棋局”开始。</p>
          <button id="analyze-game" class="secondary" disabled>分析本局（下一课接入 Agent）</button>
        </aside>
      </section>

      <section class="lesson-note">
        <h2>今天要观察的三个问题</h2>
        <ol>
          <li>浏览器点击后，哪一个 HTTP 请求真正改变了棋局？</li>
          <li>刷新页面后，棋子为什么还在？数据存在哪里？</li>
          <li>为什么 AI Key 以后必须放在 Flask 后端，而不能写进 app.js？</li>
        </ol>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
