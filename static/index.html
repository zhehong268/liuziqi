<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1c5148" />
  <title>六子棋 · Agent 对弈室</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div><p class="eyebrow">CONNECT6 / 电子斗蛐蛐</p><h1>六子棋<span>对弈室</span></h1>
        <p class="subtitle">落子、交锋，再和你的 Agent 一起复盘。</p></div>
      <div class="version">初版 DEMO <span>01</span></div>
    </header>
    <section class="toolbar" aria-label="对局操作">
      <div class="start-controls">
        <label for="opponent">对手</label>
        <select id="opponent"><option value="local">我的规则 AI · 离线</option><option value="model" disabled>大模型 AI · 需配置</option></select>
        <button id="new-game" class="primary" disabled>新建棋局</button>
      </div>
      <div class="export-controls">
        <a id="export-game" class="button-link disabled" href="#" aria-disabled="true">导出 TXT</a>
        <a id="export-json" class="button-link disabled" href="#" aria-disabled="true">导出 JSON</a>
      </div>
    </section>
    <section class="game-layout">
      <div class="board-card">
        <div class="game-meta"><span id="game-status" class="status">正在连接…</span><span id="turn-status"></span></div>
        <div id="board" class="board" role="group" aria-label="19乘19六子棋棋盘"></div>
        <div class="board-caption"><span><i class="legend-stone black"></i>你执黑</span><span><i class="legend-stone white"></i>AI 执白</span><span>黑方首回合 1 子 · 随后每回合 2 子 · 六连胜</span></div>
        <div class="replay">
          <label for="replay-slider">棋谱回放 <strong id="replay-label">0 / 0</strong></label>
          <input id="replay-slider" type="range" min="0" max="0" value="0" disabled />
          <button id="replay-end" class="quiet" disabled>回到最新</button>
        </div>
      </div>
      <aside class="side-stack">
        <section class="side-card">
          <div class="section-title"><h2>本局</h2><span id="opponent-label" class="small-tag">规则 AI</span></div>
          <dl><div><dt>棋局编号</dt><dd id="game-id">—</dd></div>
            <div><dt>当前玩家</dt><dd id="current-player">—</dd></div>
            <div><dt>本回合剩余</dt><dd id="remaining-stones">—</dd></div></dl>
          <p id="message" class="message" role="status" aria-live="polite">正在初始化棋盘…</p>
          <button id="retry-ai" class="secondary" hidden>继续 AI 回合</button>
          <div id="ai-decision" class="decision" hidden></div>
        </section>
        <section class="side-card agent-card">
          <div class="section-title"><h2>Agent 复盘</h2><span class="agent-dot" aria-hidden="true"></span></div>
          <p class="card-note">找出本局的问题，给下一局一点方向。</p>
          <button id="analyze-game" class="primary full-width" disabled>分析当前棋局</button>
          <div id="analysis" class="analysis" hidden></div>
        </section>
        <section class="side-card">
          <div class="section-title"><h2><label for="history">历史对局</label></h2><span class="small-tag">最近 50 局</span></div>
          <select id="history" aria-label="选择历史对局" disabled><option value="">正在读取…</option></select>
          <p class="card-note">对局自动保存，刷新后可以继续。</p>
        </section>
      </aside>
    </section>
    <footer><span>六子棋 Agent Demo · Flask + SQLite</span><a href="http://139.196.148.174/connect6" target="_blank" rel="noreferrer">平台六子棋规则 ↗</a></footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
